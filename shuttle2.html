<!DOCTYPE html>
<!--
  공항 순환셔틀 여행객용 보드 — 제1합동청사 ↔ 제1터미널 (구 visitor.html)
  - 용도: 제1합동청사 쪽에 주차하고 제1터미널을 오가는 방문객용. 방향별 2그룹으로 표시.
    · 갈 때: 공항04 국제업무단지 → 제1터미널(3층 8번 하차)
    · 올 때: 공항03 제1터미널 3층 3번/12번 → 국제업무단지(제1합동청사)
  - 아래에 공항03/공항04 탭 노선도: 전체 정류장 + 타는 곳·내리는 곳 강조, 정류장마다 다음 버스 시각·남은 시간 상시 표시,
    시간표로 추정한 현재 버스 위치를 🚌 깜박임으로 표시(GPS 아님 — 앞 정류장 통과~다음 정류장 도착 전 구간 추정).
  - 데이터: 인천공항+ 앱 API (icnplus.airport.kr:11040) — 인증 불필요, 고정 시간표(평일/주말).
    정류장 목록도 API에서 동적 수신(노선 개편 자동 반영).
  - 로컬 파일 의존 없음. 내 정류장 보드는 shuttle.html(배포본 index.html) 참고.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>공항셔틀2 — 제1합동청사 ↔ 제1터미널</title>
<style>
  :root {
    --bg:#0f1216; --panel:#171b21; --line:#262c35; --fg:#e6e9ee;
    --muted:#9aa4b2; --accent:#4f9cf9; --soon:#34d399; --warn:#fbbf24;
    --chip:#1f242c; --chipPast:#141821;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --fg:#1a1d21; --muted:#6b7280; --chip:#eef1f5; --chipPast:#f4f5f7; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:600px; margin:0 auto; padding:22px 16px 60px; }
  header { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h1 { font-size:19px; margin:0; }
  .day { color:var(--muted); font-size:13px; }
  .bar { display:flex; align-items:center; gap:10px; margin:12px 0 18px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  .updated { color:var(--muted); font-size:12px; margin-left:auto; }
  .ghead { font-size:17px; font-weight:800; margin:26px 0 4px; padding:2px 0 2px 10px; border-left:4px solid var(--accent); }
  .ghead:first-child { margin-top:0; }
  .gnote { font-size:12px; color:var(--muted); margin:0 0 10px; padding-left:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .route { font-size:13px; color:var(--accent); font-weight:700; }
  .stop { font-size:16px; font-weight:700; margin:2px 0 1px; }
  .dir { font-size:12px; color:var(--muted); }
  .next { display:flex; align-items:baseline; gap:12px; margin-top:12px; }
  .time { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
  .eta { font-size:15px; font-weight:700; color:var(--soon); }
  .eta.warn { color:var(--warn); }
  .after { color:var(--muted); font-size:13px; margin-top:6px; }
  details { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  summary { cursor:pointer; font-size:13px; color:var(--muted); font-weight:600; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸ "; }
  details[open] summary::before { content:"▾ "; }
  .ttbar { display:flex; gap:6px; margin:12px 0 10px; }
  .seg { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:7px; padding:4px 12px; font-size:12px; font-weight:600; cursor:pointer; }
  .seg.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { flex:0 0 calc((100% - 30px) / 6); box-sizing:border-box; height:28px; line-height:28px; text-align:center;
          font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums;
          background:var(--chip); color:var(--fg); border-radius:6px; }
  @media (max-width:420px){ .chip { flex-basis:calc((100% - 18px) / 4); } }
  .chip.past { background:var(--chipPast); color:var(--muted); opacity:.55; }
  .chip.now { background:var(--soon); color:#08130d; }
  .err { color:var(--warn); font-size:14px; margin-top:10px; }
  footer { color:var(--muted); font-size:11px; margin-top:14px; line-height:1.6; }

  /* ---------- 노선도 (탭 + 세로 라인) ---------- */
  .rtabs { display:flex; gap:6px; margin:0 0 12px; }
  .rtab { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:7px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .rtab.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .board { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 14px; }
  .stoprow { display:grid; grid-template-columns:26px 1fr; cursor:pointer; }
  .rail { position:relative; }
  .rail::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--line); }
  .stoprow:first-child .rail::before { top:20px; }
  .stoprow:last-child .rail::before { bottom:calc(100% - 20px); }
  .dot { position:absolute; left:50%; top:14px; width:11px; height:11px; margin-left:-5.5px;
         border-radius:50%; background:var(--panel); border:2.5px solid var(--muted); }
  .stoprow.on-board .dot { border-color:var(--accent); background:var(--accent); }
  .stoprow.off-board .dot { border-color:var(--soon); background:var(--soon); }
  .busmark { position:absolute; left:50%; bottom:-9px; transform:translateX(-50%); z-index:1;
             font-size:14px; line-height:1; animation:busblink 1.1s ease-in-out infinite; }
  @keyframes busblink { 0%, 100% { opacity:1; } 50% { opacity:.15; } }
  .rinfo { padding:9px 0 9px 8px; border-bottom:1px solid var(--line); min-width:0; }
  .stoprow:last-child .rinfo { border-bottom:0; }
  .nmline { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .nm { font-size:13.5px; font-weight:600; }
  .stoprow.on-board .nm, .stoprow.off-board .nm { font-weight:800; }
  .badge { font-size:10.5px; font-weight:700; color:#fff; background:var(--accent); border-radius:5px; padding:1px 6px; }
  .badge.off { background:var(--soon); color:#08130d; }
  .rnext { display:none; font-size:12.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums; }
  .stoprow.on-board .rnext, .stoprow.open .rnext { display:block; }  /* 도착 예정은 타는 곳만 상시 표시, 나머지는 펼쳤을 때 */
  .rnext b { color:var(--fg); font-size:14px; font-weight:800; }
  .rnext .eta { font-size:12.5px; }
  .rexpand { display:none; padding:2px 0 12px 8px; }
  .stoprow.open .rexpand { display:block; }
  .rexpand .ttbar { margin-top:8px; }
  .rexpand .chip { height:26px; line-height:26px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>제1합동청사 ↔ 제1터미널 셔틀</h1>
    <span class="day" id="dayType">—</span>
  </header>
  <div class="bar">
    <button id="refresh">새로고침</button>
    <span class="updated" id="updated">—</span>
  </div>
  <div id="cards"></div>

  <div class="ghead">노선 전체 정류장</div>
  <p class="gnote">파랑 = 타는 곳 · 초록 = 내리는 곳 · 🚌 = 시간표로 추정한 현재 버스 위치 · 정류장을 누르면 전체 시간표</p>
  <div class="rtabs" id="rtabs"></div>
  <div class="board" id="routeBoard"><div class="err">정류장 불러오는 중…</div></div>

  <footer>
    시간표 기준(실시간 GPS 아님) · 자정 이후 편·내일 첫차까지 반영 · 평일/주말 자동 구분.<br />
    🚌 위치는 "앞 정류장을 지났고 다음 정류장 도착 전"인 구간을 시간표로 추정한 것 — 실제와 다를 수 있습니다.<br />
    공항03은 같은 버스가 3층 3번을 먼저, 3층 12번을 다음에 지나갑니다. 가까운 문에서 타세요.
  </footer>
</div>

<script>
const GROUPS = [
  {
    title: "① 제1합동청사 → 제1터미널",
    note: "주차 후 터미널 갈 때 · 국제업무단지 정류장에서 탑승",
    stops: [
      { route: "공항04", name: "국제업무단지", stopId: "00003013", dir: "→ 제1터미널 방향 (3층 8번 하차)" },
    ],
  },
  {
    title: "② 제1터미널 → 제1합동청사",
    note: "돌아갈 때 · 3층 3번·12번 중 가까운 곳에서 탑승, 국제업무단지 하차",
    stops: [
      { route: "공항03", name: "제1터미널 3층 3번",  stopId: "00002009", dir: "→ 국제업무단지(제1합동청사) 방향" },
      { route: "공항03", name: "제1터미널 3층 12번", stopId: "00002010", dir: "→ 국제업무단지(제1합동청사) 방향" },
    ],
  },
];
const STOPS = GROUPS.flatMap((g) => g.stops);

// 노선도 탭: 타는 곳/내리는 곳은 위 그룹 시나리오 기준
const ROUTES = [
  { rteId: "00002", label: "공항03", board: ["00002009", "00002010"], alight: ["00002012"] },
  { rteId: "00003", label: "공항04", board: ["00003013"], alight: ["00003015"] },
];
const SEG_MAX_MIN = 20;  // 정류장 간 이동시간 상한(분) — 넘으면 종착/운행공백으로 보고 🚌 표시 안 함
const BASE = "https://icnplus.airport.kr:11040/api/transportation/shuttle";
const API = `${BASE}/buses/stops`;

const toMin = (hhmm) => { const s = String(hhmm).padStart(4,"0"); return parseInt(s.slice(0,2),10)*60 + parseInt(s.slice(2),10); };
const isWeekend = (d) => [0,6].includes(d.getDay());
const cache = {};        // stopId -> { weekday:[분], weekend:[분] }
const dayView = {};      // stopId -> 'weekday' | 'weekend' (전체 시간표에서 선택한 요일)
const routeStops = {};   // rteId -> [{ stopId, name }]
let routeTab = ROUTES[0].rteId;

async function loadTimetable(stopId) {
  const res = await fetch(`${API}/${stopId}`, { headers:{ Accept:"application/json" }, cache:"no-store" });
  const d = JSON.parse(await res.text());
  const data = (d && d.data) || {};
  const map = (arr) => (arr || []).map((t) => toMin(t.time)).sort((a,b)=>a-b);
  cache[stopId] = { weekday: map(data.weekdayTimes), weekend: map(data.weekendTimes) };
}

async function loadRouteStops(rteId) {
  const res = await fetch(`${BASE}/selectShuttleStops/?rteId=${rteId}&locale=ko_KR`, { headers:{ Accept:"application/json" }, cache:"no-store" });
  const arr = JSON.parse(await res.text()) || [];
  arr.sort((a,b) => parseInt(a.seq,10) - parseInt(b.seq,10));
  routeStops[rteId] = arr.map((s) => ({ stopId: s.stopId, name: s.stopNm }));
}

// 노선 전체 정류장 시간표 확보 (force = 캐시 무시 재수신)
async function ensureRouteTimetables(rteId, force = false) {
  const stops = routeStops[rteId] || [];
  await Promise.all(stops
    .filter((s) => force || !cache[s.stopId])
    .map((s) => loadTimetable(s.stopId).catch(() => {})));
}

// 어제/오늘/내일 시간표를 절대 시각으로 (자정 넘김 처리)
function timesAround(stopId, now) {
  const tt = cache[stopId];
  if (!tt) return [];
  const out = [];
  for (const off of [-1, 0, 1]) {
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off, 0, 0, 0, 0);
    const times = isWeekend(base) ? tt.weekend : tt.weekday;
    for (const m of times) out.push(new Date(base.getTime() + m * 60000));
  }
  return out.sort((a, b) => a - b);
}

const nextBuses = (stopId, now, count = 2) =>
  timesAround(stopId, now).filter((t) => t > now).slice(0, count);
function lastBusAt(stopId, now) {
  const past = timesAround(stopId, now).filter((t) => t <= now);
  return past.length ? past[past.length - 1] : null;
}

const pad = (n) => String(n).padStart(2, "0");
const fmtMin = (tot) => `${pad(Math.floor(tot/60)%24)}:${pad(tot%60)}`;   // 1450 -> "00:10"
function fmtWhen(dt, now) {
  const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const d1 = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const diff = Math.round((d1 - d0) / 86400000);
  return (diff >= 1 ? "내일 " : "") + `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}

/* ---------- 상단 방향별 카드 (details 펼침 상태 유지) ---------- */
function buildCards() {
  const box = document.getElementById("cards");
  box.innerHTML = "";
  for (const g of GROUPS) {
    const h = document.createElement("div");
    h.className = "ghead";
    h.textContent = g.title;
    box.appendChild(h);
    const n = document.createElement("p");
    n.className = "gnote";
    n.textContent = g.note;
    box.appendChild(n);
    for (const s of g.stops) {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML =
        `<div class="route">${s.route}</div>` +
        `<div class="stop">${s.name}</div>` +
        `<div class="dir">${s.dir}</div>` +
        `<div id="next-${s.stopId}"></div>` +
        `<details>` +
          `<summary>전체 시간표</summary>` +
          `<div class="ttbar">` +
            `<button class="seg" data-day="weekday" data-stop="${s.stopId}">평일</button>` +
            `<button class="seg" data-day="weekend" data-stop="${s.stopId}">주말·공휴일</button>` +
          `</div>` +
          `<div class="chips" id="tt-${s.stopId}"></div>` +
        `</details>`;
      box.appendChild(c);
    }
  }
  // 요일 토글
  box.querySelectorAll(".seg").forEach((b) => {
    b.addEventListener("click", () => {
      dayView[b.dataset.stop] = b.dataset.day;
      renderChips(b.dataset.stop, new Date());
    });
  });
}

function renderNext(stopId, now) {
  const el = document.getElementById(`next-${stopId}`);
  if (!el) return;
  if (!cache[stopId]) { el.innerHTML = `<div class="err">시간표 불러오는 중…</div>`; return; }
  const nx = nextBuses(stopId, now, 2);
  if (!nx.length) { el.innerHTML = `<div class="err">운행 정보 없음</div>`; return; }
  const etaMin = Math.round((nx[0] - now) / 60000);
  const etaTxt = etaMin <= 1 ? "곧 도착" : `${etaMin}분 후`;
  const warn = etaMin <= 3 ? "" : "warn";
  const after = nx[1] ? `다음 ${fmtWhen(nx[1], now)} (${Math.round((nx[1]-now)/60000)}분 후)` : "";
  el.innerHTML =
    `<div class="next"><span class="time">${fmtWhen(nx[0], now)}</span>` +
    `<span class="eta ${warn}">${etaTxt}</span></div>` +
    (after ? `<div class="after">${after}</div>` : "");
}

// 시간표 칩 공통 렌더 (카드: tt-*, 노선도: rtt-*)
function renderChipsInto(el, stopId, now, segSelector) {
  if (!el || !cache[stopId]) return;
  const todayKey = isWeekend(now) ? "weekend" : "weekday";
  const key = dayView[stopId] || todayKey;
  document.querySelectorAll(segSelector).forEach((b) =>
    b.classList.toggle("on", b.dataset.day === key));
  const times = cache[stopId][key];
  const isToday = key === todayKey;
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
  let nextMarked = false;
  el.innerHTML = times.map((tot) => {
    let cls = "chip";
    if (isToday) {
      const t = new Date(midnight.getTime() + tot * 60000);
      if (t <= now) cls += " past";
      else if (!nextMarked) { cls += " now"; nextMarked = true; }
    }
    return `<span class="${cls}">${fmtMin(tot)}</span>`;
  }).join("");
}
const renderChips = (stopId, now) =>
  renderChipsInto(document.getElementById(`tt-${stopId}`), stopId, now, `.seg[data-stop="${stopId}"]:not(.rseg)`);
const renderRouteChips = (stopId, now) =>
  renderChipsInto(document.getElementById(`rtt-${stopId}`), stopId, now, `.rseg[data-stop="${stopId}"]`);

/* ---------- 노선도 탭 ---------- */
function buildTabs() {
  const box = document.getElementById("rtabs");
  box.innerHTML = "";
  for (const r of ROUTES) {
    const b = document.createElement("button");
    b.className = "rtab" + (r.rteId === routeTab ? " on" : "");
    b.textContent = r.label;
    b.addEventListener("click", async () => {
      routeTab = r.rteId;
      box.querySelectorAll(".rtab").forEach((t) => t.classList.toggle("on", t.textContent === r.label));
      buildRouteBoard();
      await ensureRouteTimetables(r.rteId);
      renderRouteAll(new Date());
    });
    box.appendChild(b);
  }
}

function buildRouteBoard() {
  const box = document.getElementById("routeBoard");
  const route = ROUTES.find((r) => r.rteId === routeTab);
  const stops = routeStops[routeTab];
  if (!stops) { box.innerHTML = `<div class="err">정류장 목록을 불러오지 못했습니다. 새로고침을 눌러주세요.</div>`; return; }
  box.innerHTML = "";
  for (const s of stops) {
    const onB = route.board.includes(s.stopId);
    const offB = route.alight.includes(s.stopId);
    const row = document.createElement("div");
    row.className = "stoprow" + (onB ? " on-board" : "") + (offB ? " off-board" : "");
    row.dataset.stop = s.stopId;
    row.innerHTML =
      `<div class="rail"><span class="dot"></span></div>` +
      `<div class="rinfo">` +
        `<div class="nmline"><span class="nm">${s.name}</span>` +
        (onB ? `<span class="badge">타는 곳</span>` : "") +
        (offB ? `<span class="badge off">내리는 곳</span>` : "") + `</div>` +
        `<div class="rnext" id="rnext-${s.stopId}">…</div>` +
        `<div class="rexpand">` +
          `<div class="ttbar">` +
            `<button class="seg rseg" data-day="weekday" data-stop="${s.stopId}">평일</button>` +
            `<button class="seg rseg" data-day="weekend" data-stop="${s.stopId}">주말·공휴일</button>` +
          `</div>` +
          `<div class="chips" id="rtt-${s.stopId}"></div>` +
        `</div>` +
      `</div>`;
    row.addEventListener("click", () => {
      row.classList.toggle("open");
      if (row.classList.contains("open")) renderRouteChips(s.stopId, new Date());
    });
    box.appendChild(row);
  }
  // 요일 토글 (행 접힘 방지 위해 클릭 전파 차단)
  box.querySelectorAll(".rseg").forEach((b) => {
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      dayView[b.dataset.stop] = b.dataset.day;
      renderRouteChips(b.dataset.stop, new Date());
    });
  });
}

function renderRouteNext(stopId, now) {
  const el = document.getElementById(`rnext-${stopId}`);
  if (!el) return;
  if (!cache[stopId]) { el.textContent = "시간표 불러오는 중…"; return; }
  const nx = nextBuses(stopId, now, 2);
  if (!nx.length) { el.textContent = "운행 정보 없음"; return; }
  const etaMin = Math.round((nx[0] - now) / 60000);
  const etaTxt = etaMin <= 1 ? "곧 도착" : `${etaMin}분 후`;
  const warn = etaMin <= 3 ? "" : "warn";
  const after = nx[1] ? ` · 다음 ${fmtWhen(nx[1], now)}` : "";
  el.innerHTML = `<b>${fmtWhen(nx[0], now)}</b> <span class="eta ${warn}">${etaTxt}</span>${after}`;
}

// 시간표 기준 현재 버스 위치 추정: 정류장 i를 지난 버스가 아직 i+1에 도착 전이면 그 구간에 🚌
function renderBusPositions(now) {
  const box = document.getElementById("routeBoard");
  box.querySelectorAll(".busmark").forEach((e) => e.remove());
  const stops = routeStops[routeTab] || [];
  for (let i = 0; i < stops.length - 1; i++) {
    const a = lastBusAt(stops[i].stopId, now);
    if (!a) continue;
    const b = timesAround(stops[i + 1].stopId, now).find((t) => t > a);
    if (!b || now >= b) continue;
    if (b - a > SEG_MAX_MIN * 60000) continue;
    const rail = box.querySelector(`.stoprow[data-stop="${stops[i].stopId}"] .rail`);
    if (rail) {
      const m = document.createElement("span");
      m.className = "busmark";
      m.textContent = "🚌";
      m.title = `${fmtWhen(a, now)} ${stops[i].name} 통과 → ${fmtWhen(b, now)} ${stops[i + 1].name} 도착 예정`;
      rail.appendChild(m);
    }
  }
}

function renderRouteAll(now) {
  const stops = routeStops[routeTab] || [];
  for (const s of stops) {
    renderRouteNext(s.stopId, now);
    const row = document.querySelector(`.stoprow[data-stop="${s.stopId}"]`);
    if (row && row.classList.contains("open")) renderRouteChips(s.stopId, now);
  }
  renderBusPositions(now);
}

function tick() {
  const now = new Date();
  document.getElementById("dayType").textContent = "오늘: " + (isWeekend(now) ? "주말·공휴일" : "평일");
  for (const s of STOPS) { renderNext(s.stopId, now); renderChips(s.stopId, now); }
  renderRouteAll(now);
  document.getElementById("updated").textContent =
    "갱신 " + now.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
}

async function reload() {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "불러오는 중…";
  try {
    const jobs = STOPS.map((s) => loadTimetable(s.stopId));
    jobs.push(...ROUTES.filter((r) => !routeStops[r.rteId]).map((r) => loadRouteStops(r.rteId).catch(() => {})));
    await Promise.all(jobs);
  }
  catch (e) { document.getElementById("updated").textContent = "불러오기 실패: " + (e.message || e); }
  if (!document.querySelector("#routeBoard .stoprow")) buildRouteBoard();
  await ensureRouteTimetables(routeTab, true);   // 활성 탭 전체 정류장 시간표(재수신 포함)
  btn.disabled = false; btn.textContent = "새로고침";
  tick();
}

document.getElementById("refresh").addEventListener("click", reload);
buildCards();
buildTabs();
reload();
setInterval(tick, 30 * 1000);              // 30초마다 카운트다운/버스 위치/시간표 하이라이트 갱신
setInterval(reload, 6 * 60 * 60 * 1000);   // 6시간마다 시간표 재수신
</script>
</body>
